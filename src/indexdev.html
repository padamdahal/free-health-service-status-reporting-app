async function fetchMetadata() {
	const program = document.getElementById('reportType').value.split("-")[0];
	const programStage = document.getElementById('reportType').value.split("-")[1];
    const url = `${DHIS2_BASE_URL}/api/programStages/${programStage}?fields=
        id,name,programStageSections[id,name,sortOrder,dataElements[id]],
        programStageDataElements[sortOrder,compulsory,displayInReports,dataElement[
                id,name,shortName,formName,displayShortName,valueType,description,optionSet[id]]]`;
    const res = await fetch(url, {
        headers: { "Authorization": AUTH }
    });
    return await res.json();
}

async function fetchOptionSets(ids) {
    if (!ids.length) return {};
    const url = `${DHIS2_BASE_URL}/api/optionSets?filter=id:in:[${ids.join(",")}]&fields=id,options[code,name]`;
    const res = await fetch(url, {
        headers: { "Authorization": AUTH }
    });
    const data = await res.json();
    let map = {};
    data.optionSets.forEach(os => {
        map[os.id] = os.options;
    });
    return map;
}

function getLabel(de) {
    return de.formName || de.displayShortName || de.shortName || de.name;
}

function generateField(de, optionSets, compulsory, value) {
    const id = `${de.id}_field`;
	const required = (compulsory)?'required':'';
    if (de.optionSet) {
        const options = optionSets[de.optionSet.id] || [];
        let html = `<select id="${id}">
                        <option value="">Select</option>`;

        options.forEach(opt => {
            html += `<option value="${opt.code}" ${opt.code === value ? "selected" : ""}>${opt.name}</option>`;
        });
        html += `</select>`;
        return html;
    }

    switch (de.valueType) {
        case "TEXT":
        case "LONG_TEXT":
            return `<input type="text" id="${id}" value="${value || ""}" ${required}>`;
        case "NUMBER":
			return `<input type="number" id="${id}" value="${value || ""}" ${required}>`;
        case "INTEGER":
            return `<input type="number" id="${id}" value="${value || ""}" ${required}>`;
        case "DATE":
            return `<input type="date" id="${id}" value="${value || ""}" ${required}>`;
        case "TRUE_ONLY":
			const checked = value === "true" ? "checked" : "";
            return `<input type="checkbox" id="${id}" ${checked} ${required}>`;
        case "PHONE_NUMBER":
            return `<input type="tel" id="${id}" value="${value || ""}" ${required}>`;
		case "FILE_RESOURCE":
            return `<input type="file" id="${id}" value="${value || ""}" ${required}>`;
        default:
            return `<input type="text" id="${id}" value="${value || ""}" ${required}>`;
    }
}

async function loadEvents() {

		const metadata = await fetchMetadata(PROGRAM_STAGE);
		const elements = metadata.programStageDataElements;
		const ORG_UNIT = document.getElementById('orgUnit').value;
		const reportElements = elements.filter(e => e.displayInReports);

		const res = await fetch(
			`${DHIS2_BASE_URL}/api/events.json?programStage=${PROGRAM_STAGE}&orgUnit=${ORG_UNIT}&paging=false&fields=event,eventDate,dataValues[dataElement,value]`,
			{ headers: { Authorization: AUTH } }
		);

		const data = await res.json();
		let html = `<table>
			<tr>
				<th>Date</th>`;
		reportElements.forEach(e => {
			html += `<th>${getLabel(e.dataElement)}</th>`;
		});

		html += `<th>Action</th></tr>`;
		data.events.forEach(ev => {
			html += `<tr><td>${ev.eventDate}</td>`;
			reportElements.forEach(e => {
				const dv = ev.dataValues.find(d => d.dataElement === e.dataElement.id);
				html += `<td>${dv ? dv.value : ""}</td>`;
			});
			html += `<td><button onclick="openEditModal('${ev.event}')">Update</button></td></tr>`;
		});

		html += `</table>`;
		document.getElementById("event-list").innerHTML = html;
		
		// Hide add new button for one time information
		if(data.events.length != 0 && PROGRAM_STAGE == 'g0d1go4MmzA'){
			document.getElementById("addNew").style.display = "none";
		}
	}

function getDisplayInReports(list, dataElementId) {
    const item = list.find(e => e.dataElement.id === dataElementId);
    return item ? item.displayInReports : false;
}
async function submitUpdate() {
	const ORG_UNIT = document.getElementById('orgUnit').value;
	const PROGRAM = document.getElementById("reportType").value.split("-")[0];
	const PROGRAM_STAGE = document.getElementById("reportType").value.split("-")[1];
    const metadata = await fetchMetadata(PROGRAM_STAGE);
    let dataValues = [];
	
    for (let item of metadata.programStageDataElements) {
        const de = item.dataElement;
        const el = document.getElementById(`${de.id}_edit`);
        if (!el) continue;

        if (el.type === "file" && el.files.length) {
            const fileId = await uploadFile(el.files[0]);
            dataValues.push({
                dataElement: de.id,
                value: fileId
            });
        }else if (el.type === "checkbox") {
            if (el.checked) {
                dataValues.push({
                    dataElement: de.id,
                    value: "true"
                });
            }
        }else if (el.value) {
            dataValues.push({
                dataElement: de.id,
                value: el.value
            });
        }
    }
    const payload = {
        event: currentEventId,
        program: PROGRAM,
        programStage: PROGRAM_STAGE,
        orgUnit: ORG_UNIT,
        status: "COMPLETED",
        dataValues: dataValues
    };
	
    const res = await fetch(`${DHIS2_BASE_URL}/api/events/${currentEventId}`, {
        method: "PUT",
        headers: {
            Authorization: AUTH,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        alert("Updated successfully");
        closeModal();
        loadEvents();
    } else {
        alert("Update failed");
    }
}
