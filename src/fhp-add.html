	<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 auto;
            background-color: var(--bg-light);
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #fff;
        }

        .header-label {
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .required { color: red; }

        .top-field {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .section-title {
			font-size: 20px;
			font-weight:bold;
			padding: 20px 10px;
			background: #efefef;
			margin: 5px 0;
        }

        .form-row-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            font-size: 16px;
            color: var(--primary-blue);
            font-weight: bold;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            align-items: center;
            padding: 10px 0;
            /*border-bottom: 1px solid #ccc;*/
        }

        input, select {
            width: 50%;
            height: 40px;
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
			background: #fff !important;
        }

        .upload-group {
            display: flex;
            width: 100%;
        }

        .upload-group input {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            background: #fdfdfd;
        }

        .upload-btn {
            padding: 0 15px;
            border: 1px solid var(--border-color);
            border-left: none;
            background: #d1d1d1;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 18px;
        }

        .upload-btn:hover { background: #bcbcbc; }

        .submit-container {
            margin-top: 30px;
            text-align: right;
        }

        .btn-submit {
            color: white;
			padding: 15px 40px;
			border: none;
			border-radius: 4px;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			transition: background 0.3s;
			margin-top: 10px;
			width: 100%;
			background: #337ab7;
        }

        .btn-submit:hover {
            background-color: #2c4b63;
        }

        @media (max-width: 600px) {
            .top-field, .form-row-header, .form-row {
                grid-template-columns: 1fr;
            }
            .form-row-header div:last-child { display: none; }
            .form-row { border-bottom: none; margin-bottom: 15px; }
            .btn-submit { width: 100%; }
        }
		.row{padding:15px !important}
		.form-row{border-bottom:1px solid #ccc;}
    </style>
